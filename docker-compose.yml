services:
  cemp:
    build:
      context: .
      args:
        CEMP_BASE_IMAGE: ${CEMP_BASE_IMAGE:-quay.io/condaforge/miniforge3:23.11.0-0}
    env_file:
      - .env.example
    environment:
      CEMP_DEBUG: ${CEMP_DEBUG:-true}
      CEMP_SECRET_KEY: ${CEMP_SECRET_KEY:-change-this-local-demo-secret}
      CEMP_DEMO_FERNET_SEED: ${CEMP_DEMO_FERNET_SEED:-change-this-local-demo-fernet-seed}
      CEMP_SQLITE_PATH: ${CEMP_SQLITE_PATH:-/app/public_demo.sqlite3}
      CEMP_ALLOWED_HOSTS: ${CEMP_ALLOWED_HOSTS:-127.0.0.1,localhost,0.0.0.0}
      CEMP_CSRF_TRUSTED_ORIGINS: ${CEMP_CSRF_TRUSTED_ORIGINS:-http://localhost:8000,http://127.0.0.1:8000}
      CEMP_CORS_ALLOW_ALL_ORIGINS: ${CEMP_CORS_ALLOW_ALL_ORIGINS:-true}
      CEMP_SITE_DOMAIN: ${CEMP_SITE_DOMAIN:-http://localhost:8000}
      CEMP_IL_MODEL_DIR: ${CEMP_IL_MODEL_DIR:-/app/ionic_liquid/static/model}
      MP_API_KEY: ${MP_API_KEY:-}
      CEMP_ENABLE_MYSQL: ${CEMP_ENABLE_MYSQL:-false}
      CEMP_EMAIL_BACKEND: ${CEMP_EMAIL_BACKEND:-django.core.mail.backends.console.EmailBackend}
      CEMP_DEFAULT_FROM_EMAIL: ${CEMP_DEFAULT_FROM_EMAIL:-CEMP Platform <noreply@localhost>}
    ports:
      - "${CEMP_HOST_PORT:-8000}:8000"
    volumes:
      - cemp_public_media:/app/media
      - cemp_public_staticfiles:/app/staticfiles
      - cemp_public_logs:/app/logs

volumes:
  cemp_public_media:
  cemp_public_staticfiles:
  cemp_public_logs:
